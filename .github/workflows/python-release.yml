name: Release Python SDK

# Two ways to publish sdks/python to PyPI:
#
# 1. Automatic, on push to main: if pyproject.toml's `version` no longer
#    matches what's live on PyPI, it publishes. The human gate is the
#    version bump itself — bumping it and merging to main IS the release
#    approval, the same philosophy as the npm changesets flow in
#    release.yml and the Flutter auto-publish in flutter-release.yml. A
#    push that doesn't change the version publishes nothing.
#
# 2. Manual, via workflow_dispatch: type PUBLISH to confirm, and it
#    publishes regardless of whether the version changed — for the very
#    first release, or a deliberate republish.
#
# ci.yml already builds and `twine check`s this package on every PR, so
# the artefact is known-good before either path runs its own copy of the
# same gates on the exact ref being released.
#
# Uses PyPI Trusted Publishing (OIDC) — the same no-long-lived-token
# approach docs/releases.md in this repo documents for the @swalvo/* npm packages
# and flutter-release.yml uses for pub.dev. One-time setup on pypi.org,
# once the package exists there (or via a *pending* publisher beforehand,
# see docs/releases.md):
#   pypi.org -> project -> Publishing -> Add a new publisher
#     Owner:      atulsinghhhh
#     Repository: swalvo-sdks
#     Workflow:   python-release.yml
#     Environment: pypi
#
# NOTE: the distribution was renamed from `livqeno-sdk` (taken on PyPI by
# an unrelated project) to `swalvo`.
# Configure the trusted publisher above for the `swalvo` project name
# before the first release; the wheel ships the `swalvo` import package
# plus the deprecated `raven` shim.

# Paused until the first deploy: this workflow only runs when started by
# hand (Actions > Python release > Run workflow). To turn automatic runs back on,
# restore the push/pull_request triggers from git history (commit "ci: pause
# deploy and publish workflows").
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH to confirm uploading to PyPI (manual run — publishes even without a version change)'
        required: true

concurrency:
  group: python-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Push trigger only: compares pyproject.toml's version against what
  # PyPI currently serves. Manual dispatch skips this — it always
  # publishes on that path.
  detect:
    name: Detect version change
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v7
      - name: Compare local version against PyPI
        id: diff
        run: |
          set -euo pipefail
          name=$(grep '^name = ' pyproject.toml | head -1 | sed -E 's/name = "(.*)"/\1/')
          local_version=$(grep '^version = ' pyproject.toml | head -1 | sed -E 's/version = "(.*)"/\1/')
          published_version=$(curl -fsS "https://pypi.org/pypi/$name/json" 2>/dev/null | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).info.version" 2>/dev/null || echo "")
          echo "$name: local=$local_version published=${published_version:-<not published>}"
          if [ "$local_version" != "$published_version" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build, verify, publish
    needs: detect
    if: |
      always() && needs.detect.result != 'failure' &&
      (
        (github.event_name == 'push' && needs.detect.outputs.changed == 'true') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'PUBLISH')
      )
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for PyPI Trusted Publishing — mirrors id-token: write in
      # release.yml for npm OIDC and flutter-publish-package.yml for
      # pub.dev.
      id-token: write
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sdks/python/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Format check
        run: ruff format --check .

      - name: Lint
        run: ruff check --output-format=github .

      - name: Type check
        run: mypy src

      - name: Tests
        run: pytest -q

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      # Read-only inventory of what is about to be uploaded, printed to the
      # run log so a reviewer can see the artifact contents before publish.
      - name: Inspect artifact contents
        run: |
          echo "### sdist contents" >> "$GITHUB_STEP_SUMMARY"
          tar tzf dist/*.tar.gz >> "$GITHUB_STEP_SUMMARY"
          echo "### wheel contents" >> "$GITHUB_STEP_SUMMARY"
          python -m zipfile -l dist/*.whl >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist
