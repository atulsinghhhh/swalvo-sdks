name: swalvo_sdk_test_app
description: "Flutter: an integration-test dashboard for the real swalvo_rtc/swalvo_chat/swalvo_live SDKs against a real Swalvo backend."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  swalvo_rtc: ^0.3.0
  swalvo_chat: ^0.2.0
  swalvo_live: ^0.2.1
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
